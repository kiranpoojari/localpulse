 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — LocalPulse</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/feed.css">
    <link rel="stylesheet" href="css/post-card.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar-brand">
            📡 Local<span>Pulse</span>
        </div>
        <div class="navbar-actions">
            <a href="index.html" class="btn btn-outline btn-sm">← Feed</a>
            <button class="btn btn-outline btn-sm" onclick="handleLogout()">Logout</button>
        </div>
    </nav>

    <div class="container">

        <!-- Profile Card -->
        <div style="background:#fff; border-radius:16px; padding:28px;
            box-shadow:0 2px 12px rgba(0,0,0,0.08); margin-bottom:24px;">

            <div style="display:flex; align-items:center; gap:20px; margin-bottom:20px;">
                <div style="width:72px; height:72px; border-radius:50%; background:#1D3557;
                    color:#fff; display:flex; align-items:center; justify-content:center;
                    font-size:28px; font-weight:700;" id="profile-avatar">K</div>
                <div>
                    <h2 style="font-size:22px; color:#1D3557;" id="profile-username">Loading...</h2>
                    <p style="color:#6c757d; font-size:14px;" id="profile-email"></p>
                    <p style="color:#6c757d; font-size:13px; margin-top:4px;">
                        📍 <span id="profile-location">Location not set</span>
                    </p>
                </div>
            </div>

            <!-- Edit username -->
            <div style="border-top:1px solid #f0f0f0; padding-top:20px;">
                <h3 style="font-size:16px; margin-bottom:14px; color:#1D3557;">Edit Profile</h3>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="edit-username"
                        placeholder="Update your name"
                        style="flex:1; padding:10px 14px; border:2px solid #dee2e6;
                        border-radius:8px; font-size:15px;">
                    <button onclick="handleUpdateProfile()"
                        style="padding:10px 18px; background:#1D3557; color:#fff;
                        border-radius:8px; font-size:14px; font-weight:600;">
                        Save
                    </button>
                </div>
                <div id="profile-msg" style="margin-top:10px; font-size:13px; display:none;"></div>
            </div>
        </div>

        <!-- My Posts -->
        <h3 style="font-size:18px; font-weight:700; color:#1D3557; margin-bottom:16px;">
            My Alerts
        </h3>
        <div id="my-posts-container">
            <div class="loading">Loading your alerts...</div>
        </div>

    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/feed.js"></script>
    <script src="js/profile.js"></script>
    <script>
        requireAuth();
        loadProfile();
        loadMyPosts();

        async function handleLogout() {
            await logout();
        }
    </script>

</body>
</html>
