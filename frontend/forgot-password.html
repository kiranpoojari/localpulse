 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — LocalPulse</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="auth-logo">
            <h1>Local<span>Pulse</span></h1>
            <p>Reset your password</p>
        </div>

        <div class="error-msg" id="fp-error"></div>
        <div class="success-msg" id="fp-success"></div>

        <!-- Step 1: Enter Email -->
        <div class="step active" id="step1">
            <h2>Forgot Password</h2>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="fp-email" placeholder="Enter your registered email">
            </div>
            <button class="btn btn-primary btn-block" onclick="handleSendOTP()">
                Send OTP
            </button>
        </div>

        <!-- Step 2: Enter OTP -->
        <div class="step" id="step2">
            <h2>Enter OTP</h2>
            <p style="text-align:center; color:#6c757d; font-size:14px; margin-bottom:20px;">
                We sent a 6-digit OTP to your email. Valid for 10 minutes.
            </p>
            <div class="form-group">
                <label>OTP Code</label>
                <input type="text" id="fp-otp" class="otp-input"
                    placeholder="______" maxlength="6">
            </div>
            <button class="btn btn-primary btn-block" onclick="handleVerifyOTP()">
                Verify OTP
            </button>
            <br>
            <button class="btn btn-outline btn-block"
                style="border:2px solid #457B9D; color:#457B9D; margin-top:8px;"
                onclick="handleSendOTP()">
                Resend OTP
            </button>
        </div>

        <!-- Step 3: New Password -->
        <div class="step" id="step3">
            <h2>New Password</h2>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="fp-newpassword" placeholder="Minimum 6 characters">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="fp-confirmpassword" placeholder="Re-enter new password">
            </div>
            <button class="btn btn-primary btn-block" onclick="handleResetPassword()">
                Reset Password
            </button>
        </div>

        <div class="auth-footer">
            <a href="login.html">Back to Login</a>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/forgot-password.js"></script>

</body>
</html>
